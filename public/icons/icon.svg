<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title">
  <title id="title">Visual Robustness four-color grid</title>
  <defs>
    <clipPath id="icon-shape">
      <rect x="28" y="28" width="456" height="456" rx="96" />
    </clipPath>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#72d8cc" />
      <stop offset="1" stop-color="#3caea2" />
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7d77c" />
      <stop offset="1" stop-color="#e7ad37" />
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9abaff" />
      <stop offset="1" stop-color="#648de5" />
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9a87" />
      <stop offset="1" stop-color="#ed6651" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#0b1114" />
  <g clip-path="url(#icon-shape)">
    <rect x="28" y="28" width="228" height="228" fill="url(#teal)" />
    <rect x="256" y="28" width="228" height="228" fill="url(#amber)" />
    <rect x="28" y="256" width="228" height="228" fill="url(#blue)" />
    <rect x="256" y="256" width="228" height="228" fill="url(#coral)" />
    <rect x="240" y="28" width="32" height="456" fill="#0b1114" />
    <rect x="28" y="240" width="456" height="32" fill="#0b1114" />
  </g>
  <rect x="28" y="28" width="456" height="456" rx="96" fill="none" stroke="#dbe5e5" stroke-opacity="0.28" stroke-width="8" />
</svg>
