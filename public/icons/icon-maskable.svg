<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title">
  <title id="title">Visual Robustness maskable four-color grid</title>
  <defs>
    <clipPath id="mark-shape">
      <rect x="96" y="96" width="320" height="320" rx="68" />
    </clipPath>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#72d8cc" />
      <stop offset="1" stop-color="#3caea2" />
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7d77c" />
      <stop offset="1" stop-color="#e7ad37" />
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9abaff" />
      <stop offset="1" stop-color="#648de5" />
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9a87" />
      <stop offset="1" stop-color="#ed6651" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="#0b1114" />
  <g clip-path="url(#mark-shape)">
    <rect x="96" y="96" width="160" height="160" fill="url(#teal)" />
    <rect x="256" y="96" width="160" height="160" fill="url(#amber)" />
    <rect x="96" y="256" width="160" height="160" fill="url(#blue)" />
    <rect x="256" y="256" width="160" height="160" fill="url(#coral)" />
    <rect x="244" y="96" width="24" height="320" fill="#0b1114" />
    <rect x="96" y="244" width="320" height="24" fill="#0b1114" />
  </g>
  <rect x="96" y="96" width="320" height="320" rx="68" fill="none" stroke="#dbe5e5" stroke-opacity="0.28" stroke-width="6" />
</svg>
